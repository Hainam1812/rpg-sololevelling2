<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240">
  <defs>
    <radialGradient id="hAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0A0E27" stop-opacity="0"/>
    </radialGradient>
    <filter id="hGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Aura Background -->
  <circle cx="120" cy="130" r="75" fill="url(#hAura)" />

  <!-- Shadow -->
  <ellipse cx="120" cy="210" rx="42" ry="10" fill="#050714" opacity="0.6" />

  <!-- Cape / Trench coat back -->
  <path d="M96 110 L84 195 L110 200 L120 180 L130 200 L156 195 L144 110 Z" fill="#2E1065" />
  <path d="M90 120 L80 190 L100 195 Z" fill="#1E1B4B" />
  <path d="M150 120 L160 190 L140 195 Z" fill="#1E1B4B" />

  <!-- Legs -->
  <rect x="105" y="160" width="12" height="42" rx="4" fill="#1E293B" />
  <rect x="123" y="160" width="12" height="42" rx="4" fill="#0F172A" />
  <!-- Boots with cyan rune trim -->
  <rect x="103" y="194" width="15" height="14" rx="3" fill="#090D1A" />
  <rect x="122" y="194" width="15" height="14" rx="3" fill="#090D1A" />
  <rect x="103" y="194" width="15" height="3" fill="#06B6D4" />
  <rect x="122" y="194" width="15" height="3" fill="#06B6D4" />

  <!-- Torso / Dark Armor -->
  <path d="M100 110 L140 110 L134 165 L106 165 Z" fill="#111827" />
  <!-- Glowing Core / Dagger Harness -->
  <path d="M116 115 L124 115 L120 145 Z" fill="#7C3AED" filter="url(#hGlow)" />
  <line x1="120" y1="125" x2="120" y2="155" stroke="#06B6D4" stroke-width="2" />

  <!-- Arms -->
  <path d="M96 112 L82 145 L92 148 L104 118 Z" fill="#1E293B" />
  <path d="M144 112 L158 145 L148 148 L136 118 Z" fill="#0F172A" />

  <!-- Dagger in Hand -->
  <path d="M80 144 L72 135 L68 138 L76 150 Z" fill="#475569" />
  <polygon points="70,132 50,110 56,108 74,128" fill="#38BDF8" filter="url(#hGlow)" />
  <polygon points="50,110 46,106 52,108" fill="#FFFFFF" />

  <!-- Neck -->
  <rect x="114" y="96" width="12" height="16" fill="#FBCFE8" />

  <!-- Head -->
  <rect x="106" y="70" width="28" height="30" rx="8" fill="#FFE4E6" />
  <!-- Cool Anime / RPG Dark Hair -->
  <path d="M102 74 C100 50, 140 45, 142 70 C145 62, 138 52, 126 52 C114 52, 104 60, 102 74 Z" fill="#0F172A" />
  <path d="M102 74 L108 85 L114 74 L120 88 L126 73 L134 85 L140 72 L144 92 L140 94 L138 78 L128 92 L120 78 L112 90 L102 76 Z" fill="#1E1B4B" />

  <!-- Glowing Eyes -->
  <ellipse cx="114" cy="84" rx="3.5" ry="2" fill="#06B6D4" filter="url(#hGlow)" />
  <ellipse cx="128" cy="84" rx="3.5" ry="2" fill="#06B6D4" filter="url(#hGlow)" />
  <circle cx="114" cy="84" r="1" fill="#FFFFFF" />
  <circle cx="128" cy="84" r="1" fill="#FFFFFF" />

  <!-- Rune Dagger Glow Aura sparks -->
  <circle cx="58" cy="104" r="2" fill="#38BDF8" opacity="0.8" />
  <circle cx="170" cy="90" r="1.5" fill="#C4B5FD" opacity="0.7" />
  <circle cx="70" cy="170" r="2" fill="#7C3AED" opacity="0.6" />
</svg>
